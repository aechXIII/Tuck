[package]
name = "tuck-desktop"
version = "0.5.0"
edition = "2021"

[lib]
name = "tuck_desktop"
path = "src/lib.rs"

[[bin]]
name = "Tuck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.11.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "0.61.3", features = ["Win32_Security", "Win32_System_JobObjects"] }
windows-core = "0.61.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
