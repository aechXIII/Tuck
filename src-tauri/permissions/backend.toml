[[permission]]
identifier = "allow-backend-request"
description = "Allows the finite typed backend request command."
commands.allow = ["backend_request"]

[[permission]]
identifier = "allow-native-commands"
description = "Allows native desktop commands for dialogs, clipboard, folders, finished exports, and window."
commands.allow = ["platform_capabilities", "pick_video_files", "pick_lut_file", "pick_audio_files", "pick_folder", "pick_ffmpeg_file", "pick_ffprobe_file", "pick_import_file", "pick_save_file", "copy_text", "copy_file_to_clipboard", "open_output_folder", "open_export_file", "start_export_drag", "open_local_document", "open_logs_folder", "open_config_folder", "close_window", "check_for_updates", "download_update", "install_update", "get_download_progress", "get_startup_files"]

[[permission]]
identifier = "allow-window-chrome"
description = "Allows the custom title bar to minimize, maximize, open the window menu and place the Snap Layouts target."
commands.allow = ["minimize_window", "toggle_maximize_window", "set_window_fullscreen", "set_caption_maximize_area", "show_window_menu"]

[[permission]]
identifier = "allow-desktop-preferences"
description = "Allows the interface size setting, the queue-finished notification and taskbar progress."
commands.allow = ["set_interface_size", "notify_when_unfocused", "set_taskbar_progress"]

[[permission]]
identifier = "allow-app-lifecycle"
description = "Allows the page to answer a close request and to restart Tuck after its backend stopped."
commands.allow = ["acknowledge_close_request", "confirm_close", "restart_app"]

[[permission]]
identifier = "allow-preview-surface"
description = "Allows the page to place the native preview picture below it. Each command refuses unless the native preview is turned on for this run."
commands.allow = ["preview_surface_open", "preview_surface_viewport"]

[[permission]]
identifier = "allow-native-player"
description = "Allows the page to open the native player, play, pause, seek, give it the timeline, the preview mix and the LUT, read its status, and read a report on it for the diagnostic report. Each command except the report refuses unless the native engine is turned on for this run."
commands.allow = ["player_open", "player_command", "player_edits", "player_mix", "player_lut", "player_status", "player_report"]
