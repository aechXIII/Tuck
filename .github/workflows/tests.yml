name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # the tests run against the FFmpeg Tuck ships (7.1), not whatever the runner's package
  # manager has; Ubuntu 22.04 only offers 4.4, which lacks options the test fixtures use
  linux-ffmpeg:
    name: Bundled FFmpeg (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the FFmpeg build
        id: cache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-linux-sources/output
          key: linux-ffmpeg-${{ hashFiles('packaging/ffmpeg-linux-sources.lock.json', 'packaging/build-ffmpeg-linux.sh') }}

      - name: Install the build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm cmake pkg-config autoconf automake libtool meson ninja-build

      - name: Build FFmpeg from its locked sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scripts/build_linux.py --skip-pyinstaller

      - uses: actions/upload-artifact@v4
        with:
          name: linux-ffmpeg
          path: |
            build/ffmpeg-linux-sources/output/ffmpeg
            build/ffmpeg-linux-sources/output/ffprobe
          retention-days: 1

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    needs: linux-ffmpeg
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --version 7.1.1 --yes --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Download the bundled FFmpeg (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: linux-ffmpeg
          path: ${{ runner.temp }}/ffmpeg

      - name: Install the bundled FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg" "$RUNNER_TEMP/ffmpeg/ffprobe"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -version

      - name: Ruff format check
        run: ruff format --check tuck/ tests/ scripts/

      - name: Ruff lint
        run: ruff check tuck/ tests/ scripts/

      - name: Pyright
        # tuck/ has Windows-only modules (ctypes.windll, subprocess.CREATE_NO_WINDOW);
        # pyright can only resolve them on a Windows host. The Linux side is the Tauri/Rust tree.
        if: runner.os == 'Windows'
        run: pyright tuck/

      - name: Pytest
        run: pytest -m "not slow" --cov=tuck --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.12'
        with:
          file: ./coverage.xml

  frontend:
    name: Frontend (${{ matrix.os }})
    needs: linux-ffmpeg
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --version 7.1.1 --yes --no-progress
          ffmpeg -version

      - name: Download the bundled FFmpeg (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: linux-ffmpeg
          path: ${{ runner.temp }}/ffmpeg

      - name: Install the bundled FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg" "$RUNNER_TEMP/ffmpeg/ffprobe"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -version

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Rendered integration tests
        run: npm run test:e2e

  rust:
    name: Rust (${{ matrix.os }})
    needs: linux-ffmpeg
    env:
      # source tests use the development sidecar, not packaged resources
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the frontend for the Tauri context
        run: npm run build

      - name: Set up Python for the backend integration tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create the sidecar virtualenv (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -e .

      - name: Create the sidecar virtualenv (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e .

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --version 7.1.1 --yes --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Download the bundled FFmpeg (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: linux-ffmpeg
          path: ${{ runner.temp }}/ffmpeg

      - name: Install the bundled FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg" "$RUNNER_TEMP/ffmpeg/ffprobe"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -version

      - name: Install desktop dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
