name: Release

# A tag push (v*) assembles a public release: builds are signed with the Tauri
# updater key and the publish job is blocked unless that key is configured. A
# manual run assembles a release candidate: same build, verification, manifest,
# and checksums, the signing key is never decrypted, and nothing is published.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel to assemble"
        type: choice
        options:
          - release-candidate
        default: release-candidate
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'release' }}

jobs:
  windows-ffmpeg:
    uses: ./.github/workflows/windows-ffmpeg.yml

  build-windows:
    name: Build Windows (native)
    needs: windows-ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install FFmpeg and 7-Zip
        run: |
          choco install ffmpeg --yes --no-progress
          choco install 7zip --yes --no-progress

      - name: Lint and type-check
        run: |
          ruff format --check tuck/ tests/ scripts/
          ruff check tuck/ tests/ scripts/
          pyright tuck/

      - name: Python tests
        run: pytest -m "not slow"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks
        run: |
          npm run typecheck
          npm run test

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download source-built Windows media tools
        uses: actions/download-artifact@v4
        with:
          name: windows-ffmpeg-source-build
          path: build/windows-ffmpeg

      - name: Build the Python sidecar and bundled media tools
        run: python scripts/build_sidecar.py --python python

      - name: Build the Tauri Windows bundle
        # Secrets only reach a build for a version tag; a release candidate builds
        # unsigned. build.ps1 / the CLI emit updater artifacts only when the key is set.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npm run tauri build
          fi

      - name: Name the installer artifact
        id: artifact
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter *-setup.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer was produced" }
          $name = python scripts/build_metadata.py artifact-name --platform windows
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $installer.FullName "dist/$name"
          Copy-Item "build/windows-ffmpeg/Tuck-FFmpeg-Windows-Sources.tar.xz" dist/
          $sig = "$($installer.FullName).sig"
          if (Test-Path $sig) { Copy-Item $sig "dist/$name.sig" }
          "path=dist/$name" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT

      - name: Inspect the built installer
        run: python scripts/verify_package.py --platform windows --artifact "${{ steps.artifact.outputs.path }}"

      - name: Startup smoke test
        run: python scripts/smoke_packaged.py --staging

      - name: Checksum the installer
        run: python scripts/build_metadata.py checksum "${{ steps.artifact.outputs.path }}"

      - name: Record the manifest entry
        run: >
          python scripts/build_metadata.py entry
          --platform windows --kind nsis-installer
          --path "${{ steps.artifact.outputs.path }}"
          --verified-package --verified-smoke
          --signature "${{ steps.artifact.outputs.path }}.sig"
          --out dist/entry-windows.json

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: tuck-windows
          path: |
            dist/Tuck-Setup-*-x64.exe
            dist/Tuck-Setup-*-x64.exe.sha256
            dist/Tuck-Setup-*-x64.exe.sig
            dist/entry-windows.json
            dist/Tuck-FFmpeg-Windows-Sources.tar.xz
          retention-days: 7
          if-no-files-found: error

  build-linux:
    name: Build Linux (frozen Ubuntu 22.04 baseline)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install the build toolchain, WebKitGTK, and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf \
            build-essential nasm cmake pkg-config \
            squashfs-tools xvfb x11-utils \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            ffmpeg

      - name: Lint
        # pyright runs on the Windows job only: tuck/ has Windows-only modules
        # (ctypes.windll, subprocess.CREATE_NO_WINDOW) it cannot resolve on Linux.
        run: |
          ruff format --check tuck/ tests/ scripts/
          ruff check tuck/ tests/ scripts/

      - name: Python tests
        run: pytest -m "not slow"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks
        run: |
          npm run typecheck
          npm run test

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the AppImage
        # Secrets only reach a build for a version tag; a release candidate builds
        # unsigned. build-linux.sh emits and re-signs updater artifacts only when the key is set.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: ./scripts/build-linux.sh --clean

      - name: Name the AppImage artifact
        id: artifact
        run: |
          src=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | sort | tail -n 1)
          if [ -z "$src" ]; then
            echo "no AppImage was produced" >&2
            exit 1
          fi
          name=$(python scripts/build_metadata.py artifact-name --platform linux)
          mkdir -p dist
          cp "$src" "dist/$name"
          if [ -f "$src.sig" ]; then cp "$src.sig" "dist/$name.sig"; fi
          echo "path=dist/$name" >> "$GITHUB_OUTPUT"

      - name: Re-verify the renamed AppImage
        run: python scripts/verify_package.py --platform linux --artifact "${{ steps.artifact.outputs.path }}"

      - name: Startup smoke test
        run: python scripts/smoke_packaged.py --platform linux --artifact "${{ steps.artifact.outputs.path }}"

      - name: Checksum the AppImage
        run: python scripts/build_metadata.py checksum "${{ steps.artifact.outputs.path }}"

      - name: Record the manifest entry
        run: >
          python scripts/build_metadata.py entry
          --platform linux --kind appimage
          --path "${{ steps.artifact.outputs.path }}"
          --verified-package --verified-smoke
          --signature "${{ steps.artifact.outputs.path }}.sig"
          --out dist/entry-linux.json

      - name: Upload the Linux build
        uses: actions/upload-artifact@v4
        with:
          name: tuck-linux
          path: |
            dist/Tuck-*-x86_64.AppImage
            dist/Tuck-*-x86_64.AppImage.sha256
            dist/Tuck-*-x86_64.AppImage.sig
            dist/entry-linux.json
          retention-days: 7
          if-no-files-found: error

  metadata:
    name: Assemble release metadata
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the Windows build
        uses: actions/download-artifact@v4
        with:
          name: tuck-windows
          path: dist

      - name: Download the Linux build
        uses: actions/download-artifact@v4
        with:
          name: tuck-linux
          path: dist

      - name: Assemble the release manifest
        run: >
          python scripts/build_metadata.py manifest
          --channel "$RELEASE_CHANNEL"
          --entry dist/entry-windows.json
          --entry dist/entry-linux.json
          --git-commit "$GITHUB_SHA"
          --git-ref "$GITHUB_REF"
          --out dist/tuck-release-manifest.json

      - name: Copy third-party notices
        run: |
          cp packaging/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          cp packaging/THIRD_PARTY_NOTICES_LINUX.md dist/THIRD_PARTY_NOTICES_LINUX.md

      - name: Write the combined checksum list
        working-directory: dist
        run: |
          sha256sum Tuck-Setup-*-x64.exe Tuck-*-x86_64.AppImage Tuck-FFmpeg-Windows-Sources.tar.xz > SHA256SUMS
          cat SHA256SUMS

      - name: Extract the release notes
        run: >
          python scripts/build_metadata.py release-notes
          --changelog CHANGELOG.md
          --out dist/release-notes.md

      - name: Generate the updater feed for a signed build
        run: |
          win_sig="dist/$(python scripts/build_metadata.py artifact-name --platform windows).sig"
          lin_sig="dist/$(python scripts/build_metadata.py artifact-name --platform linux).sig"
          if [ -f "$win_sig" ] && [ -f "$lin_sig" ]; then
            python scripts/build_metadata.py updater-manifest \
              --windows-sig "$win_sig" --linux-sig "$lin_sig" \
              --notes dist/release-notes.md --out dist/latest.json
            cat dist/latest.json
          else
            echo "no updater signatures present; skipping latest.json (release candidate)"
          fi

      - name: Verify the assembled release
        run: >
          python scripts/verify_release.py
          --manifest dist/tuck-release-manifest.json
          --artifacts-dir dist

      - name: Verify Windows corresponding sources
        run: python scripts/windows_ffmpeg.py --verify-source dist/Tuck-FFmpeg-Windows-Sources.tar.xz

      - name: Upload the release metadata
        uses: actions/upload-artifact@v4
        with:
          name: tuck-release-metadata
          path: |
            dist/tuck-release-manifest.json
            dist/SHA256SUMS
            dist/release-notes.md
            dist/latest.json
            dist/THIRD_PARTY_NOTICES.md
            dist/THIRD_PARTY_NOTICES_LINUX.md
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the signed release
    needs: [metadata]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download every built artifact
        uses: actions/download-artifact@v4
        with:
          pattern: tuck-*
          path: dist
          merge-multiple: true

      - name: Require a signed build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Public release blocked: the Tauri updater signing key is not configured."
            echo "Generate a keypair with 'npm run tauri signer generate', add the"
            echo "TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets to the"
            echo "protected 'release' environment, and re-run this tag. Release candidates build"
            echo "unsigned artifacts without it; a production release will not ship unsigned."
            exit 1
          fi
          python - <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(
              pathlib.Path("dist/tuck-release-manifest.json").read_text(encoding="utf-8")
          )
          if manifest["signing"]["tauri_updater"] != "enabled":
              sys.exit(
                  "the signing key is set but the build produced no updater artifacts; "
                  "check the build-windows / build-linux jobs"
              )
          PY

      - name: Verify the signed release
        run: >
          python scripts/verify_release.py
          --manifest dist/tuck-release-manifest.json
          --artifacts-dir dist
          --require-signed

      - name: Require matching Windows corresponding sources
        run: python scripts/windows_ffmpeg.py --verify-source dist/Tuck-FFmpeg-Windows-Sources.tar.xz

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Tuck-Setup-*-x64.exe
            dist/Tuck-Setup-*-x64.exe.sha256
            dist/Tuck-Setup-*-x64.exe.sig
            dist/Tuck-*-x86_64.AppImage
            dist/Tuck-*-x86_64.AppImage.sha256
            dist/Tuck-*-x86_64.AppImage.sig
            dist/latest.json
            dist/SHA256SUMS
            dist/tuck-release-manifest.json
            dist/THIRD_PARTY_NOTICES.md
            dist/THIRD_PARTY_NOTICES_LINUX.md
            dist/Tuck-FFmpeg-Windows-Sources.tar.xz
          body_path: dist/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
