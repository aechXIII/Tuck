[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuck"
version = "0.1.0"
description = "Windows video compressor and upscaler."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Tuck contributors"}]
keywords = ["video", "compression", "ffmpeg", "discord", "encoding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Conversion",
]

dependencies = [
    "platformdirs>=4.0",
    "rich>=13.7",
    "packaging>=23.0",
    "pywebview==6.2.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "bump-my-version>=0.28",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "pyright>=1.1.350",
    "PyInstaller>=6.0",
]

[project.scripts]
tuck = "tuck.app:main"

[project.urls]
Homepage = "https://github.com/aechXIII/Tuck"
Repository = "https://github.com/aechXIII/Tuck"

[tool.setuptools.packages.find]
where = ["."]
include = ["tuck*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".git", ".venv", "venv", "dist", "build", "__pycache__", ".logs"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I",    # pycodestyle, pyflakes, isort
    "N",                    # pep8-naming
    "B",                    # flake8-bugbear
    "C4",                   # flake8-comprehensions
    "SIM",                  # flake8-simplify
    "UP",                   # pyupgrade
    "RUF",                  # ruff-specific
]
ignore = [
    "N818",  # Error suffix on exception names
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyright]
include = ["tuck"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "ffmpeg: marks tests requiring ffmpeg binary",
    "network: marks tests requiring network access",
]

[tool.bumpversion]
current_version = "0.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "tuck/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "scripts/installer.iss"
search = "#define MyAppVersion \"{current_version}\""
replace = "#define MyAppVersion \"{new_version}\""
